<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asesmen Fiqih Kelas X - Mulyani</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background: #f0f2f5; color: #333; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1a73e8; text-align: center; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; margin-top: 10px; }
    button:hover { background: #1557b0; }
    .question-box { margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-left: 4px solid #1a73e8; border-radius: 4px; }
    .options label { display: block; font-weight: normal; margin: 8px 0; cursor: pointer; }
    #quiz-section, #result-section { display: none; }
    .alert { padding: 12px; background: #d4edda; color: #155724; border-radius: 6px; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🌟 Asesmen Fiqih Kelas X (Zakat)</h2>

  <!-- Bagian Login Siswa -->
  <div id="login-section">
    <div class="form-group">
      <label>Nama Lengkap Siswa:</label>
      <input type="text" id="namaSiswa" placeholder="Masukkan nama lengkap Anda">
    </div>
    <div class="form-group">
      <label>Kelas:</label>
      <select id="kelasSiswa">
        <option value="">-- Pilih Kelas --</option>
        <option value="Kelas X">Kelas X</option>
      </select>
    </div>
    <button onclick="mulaiUjian()">Mulai Mengerjakan 🚀</button>
  </div>

  <!-- Bagian Soal Ujian -->
  <div id="quiz-section">
    <div id="daftar-soal">Memuat soal dari database...</div>
    <button onclick="kirimJawaban()">Kirim Jawaban & Selesaikan Ujian 📤</button>
  </div>

  <!-- Bagian Hasil -->
  <div id="result-section">
    <div class="alert">Ujian Selesai! Terima kasih telah berpartisipasi. 🎉</div>
    <h3>Nilai Akhir Anda: <span id="skor-akhir" style="color: #1a73e8;">0</span></h3>
    <p>Data nilai dan jawaban Anda telah tersimpan otomatis ke dalam sistem database Google Sheets.</p>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxLQHMBNq2EeKaix9p2RLNNtLu9EYPVqmpz3XMNiSy9KLDb2RHuu0nNi-iHGZQ3IQj/exec";

  let soalData = [];
  let jawabanSiswa = {};

  async function mulaiUjian() {
    const nama = document.getElementById('namaSiswa').value.trim();
    const kelas = document.getElementById('kelasSiswa').value;

    if (!nama) {
      alert("Mohon masukkan Nama Lengkap Anda terlebih dahulu!");
      return;
    }
    if (!kelas) {
      alert("Mohon pilih Kelas terlebih dahulu!");
      return;
    }

    // Pindahkan tampilan seketika saat tombol diklik
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    document.getElementById('daftar-soal').innerHTML = "<p>Sedang mengambil soal dari database, mohon tunggu sebentar...</p>";

    try {
      let response = await fetch(WEB_APP_URL + "?action=getSoal", {
        redirect: "follow",
        mode: "cors"
      });
      let data = await response.json();
      soalData = data;

      let htmlSoal = "";
      if (data.length === 0) {
        htmlSoal = "<p>Belum ada bank soal di database Google Sheets.</p>";
      } else {
        data.forEach((item, index) => {
          htmlSoal += `
            <div class="question-box">
              <p><b>Soal ${index + 1}:</b> ${item.pertanyaan}</p>
              <div class="options">
                <label><input type="radio" name="soal_${item.id}" value="A" onclick="simpanPilihan('${item.id}', 'A')"> A. ${item.opsiA}</label>
                <label><input type="radio" name="soal_${item.id}" value="B" onclick="simpanPilihan('${item.id}', 'B')"> B. ${item.opsiB}</label>
                <label><input type="radio" name="soal_${item.id}" value="C" onclick="simpanPilihan('${item.id}', 'C')"> C. ${item.opsiC}</label>
                <label><input type="radio" name="soal_${item.id}" value="D" onclick="simpanPilihan('${item.id}', 'D')"> D. ${item.opsiD}</label>
              </div>
            </div>
          `;
        });
      }
      document.getElementById('daftar-soal').innerHTML = htmlSoal;
    } catch (err) {
      // Fallback menggunakan mode no-cors jika fetch standar terhalang
      try {
        let resFallback = await fetch(WEB_APP_URL + "?action=getSoal");
        let dataFallback = await resFallback.json();
        soalData = dataFallback;
        let htmlSoal = "";
        dataFallback.forEach((item, index) => {
          htmlSoal += `
            <div class="question-box">
              <p><b>Soal ${index + 1}:</b> ${item.pertanyaan}</p>
              <div class="options">
                <label><input type="radio" name="soal_${item.id}" value="A" onclick="simpanPilihan('${item.id}', 'A')"> A. ${item.opsiA}</label>
                <label><input type="radio" name="soal_${item.id}" value="B" onclick="simpanPilihan('${item.id}', 'B')"> B. ${item.opsiB}</label>
                <label><input type="radio" name="soal_${item.id}" value="C" onclick="simpanPilihan('${item.id}', 'C')"> C. ${item.opsiC}</label>
                <label><input type="radio" name="soal_${item.id}" value="D" onclick="simpanPilihan('${item.id}', 'D')"> D. ${item.opsiD}</label>
              </div>
            </div>
          `;
        });
        document.getElementById('daftar-soal').innerHTML = htmlSoal;
      } catch (e) {
        document.getElementById('daftar-soal').innerHTML = "<p style='color:red;'>Gagal memuat soal. Pastikan koneksi internet stabil.</p>";
      }
    }
  }

  function simpanPilihan(idSoal, pilihan) {
    jawabanSiswa[idSoal] = pilihan;
  }

  async function kirimJawaban() {
    const nama = document.getElementById('namaSiswa').value;
    const kelas = document.getElementById('kelasSiswa').value;

    let totalPoinDiterima = 0;
    let totalPoinMaksimal = 0;

    soalData.forEach(item => {
      let poinSoal = Number(item.poin) || 2.5;
      totalPoinMaksimal += poinSoal;
      if (jawabanSiswa[item.id] === item.kunci) {
        totalPoinDiterima += poinSoal;
      }
    });

    let nilaiAkhir = totalPoinMaksimal > 0 ? Math.round((totalPoinDiterima / totalPoinMaksimal) * 100) : 0;

    let payload = {
      nama: nama,
      kelas: kelas,
      jawaban: jawabanSiswa,
      nilai: nilaiAkhir
    };

    try {
      await fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload)
      });
      
      document.getElementById('quiz-section').style.display = 'none';
      document.getElementById('result-section').style.display = 'block';
      document.getElementById('skor-akhir').innerText = nilaiAkhir;
    } catch (err) {
      document.getElementById('quiz-section').style.display = 'none';
      document.getElementById('result-section').style.display = 'block';
      document.getElementById('skor-akhir').innerText = nilaiAkhir;
    }
  }
</script>

</body>
</html>
