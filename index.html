
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesmen PAI Mulyani</title>
<style>
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f1;
  color:#294536;
}
header {
  background:#315b43;
  color:white;
  padding:22px;
  text-align:center;
}
header h1 {margin:0;font-size:25px}
header p {margin:8px 0 0}
main {
  max-width:850px;
  margin:45px auto;
  padding:20px;
}
.welcome {
  background:white;
  border-radius:18px;
  padding:35px 20px;
  text-align:center;
  box-shadow:0 4px 18px #00000012;
}
.welcome h2 {color:#315b43}
.buttons {
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  margin-top:25px;
}
button {
  background:#315b43;
  color:white;
  border:0;
  border-radius:10px;
  padding:14px 25px;
  cursor:pointer;
  font-size:15px;
}
button:hover {background:#477a5a}
footer {
  text-align:center;
  padding:20px;
  color:#718174;
}
</style>
</head>
<body>
<header>
  <h1>ASESMEN PAI MULYANI</h1>
  <p>Platform Penilaian Pendidikan Agama Islam</p>
</header>
<main>
  <section class="welcome">
    <h2>Selamat Datang!</h2>
    <p>Selamat datang di aplikasi asesmen Pendidikan Agama Islam.</p>
    <p>Silakan pilih akses sesuai dengan peran Anda.</p>
    <div class="buttons">
      <button onclick="alert('Halaman Guru akan segera dibuat!')">Masuk sebagai Guru</button>
      <button onclick="alert('Halaman Siswa akan segera dibuat!')">Masuk sebagai Siswa</button>
    </div>
  </section>
</main>
<footer>
  © 2026 Asesmen PAI Mulyani
</footer>
</body>
</html>
